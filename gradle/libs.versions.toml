[versions]
activityKtx = "1.8.2"
activityKtxVersion = "1.9.1"
agp = "8.4.0"
androidSpinkit = "1.4.0"
circleindicator = "2.1.6"
core = "3.4.1"
coreSplashscreen = "1.0.1"
datastorePreferences = "1.0.0-alpha02"
fragmentKtx = "1.8.2"
kotlin = "1.9.0"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
kotlinxCoroutinesAndroid = "1.3.9"
lifecycleViewmodelKtx = "2.8.4"
loggingInterceptor = "5.0.0-alpha.2"
material = "1.12.0"
activity = "1.9.0"
constraintlayout = "2.1.4"
androidx-navigation = "2.7.7"
hiltVersion = "2.49"
ksp = "1.9.0-1.0.13"
materialVersion = "1.3.0"
parse = "4.2.1"
pinview = "1.4.4"
playServicesLocation = "21.3.0"
retrofit = "2.9.0"
roundedimageview = "2.3.0"
sdpAndroid = "1.1.1"
shimmerrecyclerview = "v1.3"
toasty = "1.5.2"
viewpager2 = "1.0.0"
zxingAndroidEmbedded = "4.2.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }
core = { module = "com.google.zxing:core", version.ref = "core" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
#nav graph
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "androidx-navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "androidx-navigation" }
androidx-navigation-safe-args-gradle-plugin = { module = "androidx.navigation:navigation-safe-args-gradle-plugin", version.ref = "androidx-navigation" }
# hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hiltVersion" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hiltVersion" }
# ssp and sdp
ssp-android = { module = "com.intuit.ssp:ssp-android", version.ref = "sdpAndroid" }
sdp-android = { module = "com.intuit.sdp:sdp-android", version.ref = "sdpAndroid" }
#pin view
pinview = { module = "io.github.chaosleung:pinview", version.ref = "pinview" }
#view pager
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
#cirrcle indicator
circleindicator = { module = "me.relex:circleindicator", version.ref = "circleindicator" }
#parse
parse = { module = "com.github.parse-community.Parse-SDK-Android:parse", version.ref = "parse" }
#retrofit
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit2-converter-scalars = { module = "com.squareup.retrofit2:converter-scalars", version.ref = "retrofit" }
gson = { module = "com.google.code.gson:gson", version.ref = "retrofit" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "loggingInterceptor" }
#location
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
#rounded Image View
roundedimageview = { module = "com.makeramen:roundedimageview", version.ref = "roundedimageview" }
# Fragment KTX
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }
#Activity KTX
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activityKtx" }
#ViewModel
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodelKtx" }
#qr scanner
toasty = { module = "com.github.GrenderG:Toasty", version.ref = "toasty" }
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxingAndroidEmbedded" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hiltVersion" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }